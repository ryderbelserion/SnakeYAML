name: Release Build

env:
  GRADLE_USERNAME: ${{ secrets.GRADLE_USERNAME }}
  GRADLE_PASSWORD: ${{ secrets.GRADLE_PASSWORD }}

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Project
        run: gradle create

      - name: Setup Upstream
        run: gradle clone

      - name: Apply Patches
        run: gradle apply

      - name: Publish Project
        run: gradle snakeyaml-target:publish -x test